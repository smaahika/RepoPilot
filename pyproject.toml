[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0.dev0"
description = "A constrained coding agent that produces tested, reviewable patches."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "RepoPilot contributors" }]
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "setuptools>=69",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
